name: Publish documentation artifacts

# The two things the unified documentation site needs from this repository, published as
# immutable release assets so the site can pin them (FR-062, FR-064, research R8 and R9).
#
#   docs-snippets.tar.gz   every TypeScript example the site publishes, as the real modules
#                          compiled by `npm run typecheck:docs`. The site includes from these
#                          with pymdownx.snippets, so a page cannot show text that was never
#                          compiled (FR-066).
#   typedoc.json           the TypeDoc JSON the site renders the TypeScript reference from
#                          (FR-061): generated from source, never written by hand.
#
# ONE RELEASE CARRYING BOTH, not two release series. The tasks describe them separately, and
# separate pins would let the site render a reference from one commit beside examples from
# another, which is the drift the pinning exists to prevent. Pinned together they describe the
# same commit by construction, and the site has one thing to advance rather than two.
#
# WHY A RELEASE ASSET AND NOT AN ACTIONS ARTIFACT. FR-058 requires the documentation build to
# need no Node toolchain and no checkout of this repository. An Actions artifact expires and is
# awkward to fetch across repositories; a release asset is a stable URL that `curl` can take.
#
# The tag series is `docs-YYYY.N`, parallel to `conformance-YYYY.N` and `governance-YYYY.N` and
# independent of both: an example changing does not move the corpus, and neither moves this.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: The docs-YYYY.N tag to publish. It is created if it does not exist.
        required: true
  push:
    tags:
      - 'docs-*'

permissions:
  contents: write

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # TypeDoc's source links want real history rather than a single commit.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Before anything is generated. Both assets describe the built packages, so a workspace
      # that does not build must not produce either of them.
      - run: npx tsc --build

      - name: Type-check the documentation examples
        # An example that does not compile must never reach the site. This is the same check
        # the CI workflow runs; it is repeated here because this is the step that decides what
        # gets published, and a publish job that trusts another workflow to have run is a
        # publish job that will one day publish untested text.
        run: npm run typecheck:docs

      - name: Generate the TypeDoc JSON
        run: npm run docs:api

      - name: Resolve the tag
        run: |
          if [ "${{ github.event_name }}" = 'push' ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="${{ inputs.tag }}"
          fi
          case "$TAG" in
            docs-[0-9][0-9][0-9][0-9].[0-9]*) ;;
            *)
              echo "::error::$TAG is not a docs-YYYY.N tag. The site pins an immutable tag, never a branch."
              exit 1
              ;;
          esac
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Pack the snippets
        # The tree as the site includes it, plus the tsconfig that compiled it, so a reader of
        # the artifact can see what the examples were checked against rather than taking it on
        # trust. Nothing else: no node_modules, no dist, no sources.
        run: |
          tar --create --gzip --file docs-snippets.tar.gz docs-snippets tsconfig.docs.json
          ls -l docs-snippets.tar.gz .typedoc.json

      - name: Name the TypeDoc asset the way the site fetches it
        # TypeDoc writes a dotfile, and a release asset's name comes from the file's basename.
        # GitHub will not serve an asset whose name begins with a dot, so it rewrites
        # `.typedoc.json` to `default.typedoc.json` on upload. `gh release create` accepts a
        # `file#label` suffix, but that sets the DISPLAY LABEL and leaves the name alone, so the
        # rewrite happens anyway and the download URL the consumer builds is a 404.
        #
        # The consumer is scripts/sync_js_artifacts.py in idfkit-developers, which fetches
        # releases/download/<tag>/typedoc.json by construction rather than by listing the
        # release. Copying the file to the name it is fetched under is the whole fix.
        run: cp .typedoc.json typedoc.json

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            git tag "$TAG"
            git push origin "$TAG"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists. A docs level is immutable: cut a new one."
            exit 1
          fi
          gh release create "$TAG" \
            --title "Documentation artifacts $TAG" \
            --notes "TypeScript examples and TypeDoc reference for the unified documentation site, from ${GITHUB_SHA}." \
            docs-snippets.tar.gz \
            typedoc.json

      # The site is a different repository now, and a level nothing advances is a level that
      # goes stale silently. This is the JavaScript half of 003-FR-020: publishing an artifact
      # opens the pull request that renders the site from it, so the site's own checks get to
      # decide whether the pages survive the new reference. A person relaying it would be one
      # more thing to forget.
      #
      # Best effort on purpose. A publish that succeeded must not be reported as failed because
      # the notification did not land: the release is the artifact, and the pin can be advanced
      # by hand from idfkit-developers if this step is skipped.
      - name: Tell the site there is a new level
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.DOCS_SITE_DISPATCH_TOKEN || github.token }}
        run: |
          set -euo pipefail
          gh workflow run bump-docs-level.yml \
            --repo idfkit/idfkit-developers \
            -f docs_level="$TAG" \
          || echo "::warning::Could not dispatch bump-docs-level.yml in idfkit-developers. The release stands; advance [tool.idfkit.docs] there by hand."
