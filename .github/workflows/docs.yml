name: Deploy docs

on:
  push:
    branches: [main]
  workflow_dispatch:

# Only the contents read and the pages write are needed; id-token is required by
# the deploy action to prove the artifact came from this workflow run.
permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deploy in flight — a half-published site is worse than a stale
# one — but let a newer commit queue behind it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # mkdocs-material's git-revision features and the TypeDoc source links
          # both want real history rather than a single commit.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: astral-sh/setup-uv@v5

      - run: npm ci

      - run: npm run docs:build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
