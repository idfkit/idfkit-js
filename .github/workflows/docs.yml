name: Deploy docs

on:
  push:
    branches: [main]
  workflow_dispatch:

# Pushing the built site to the gh-pages branch, the same way idfkit (Python)
# publishes py.idfkit.com. Hence contents: write rather than the pages/id-token
# pair the artifact-based deployment needs.
permissions:
  contents: write

# Never cancel a deploy in flight — a half-published site is worse than a stale
# one — but let a newer commit queue behind it.
concurrency:
  group: gh-pages
  cancel-in-progress: false

env:
  # ------------------------------------------------------------------------------------------
  # THE CUTOVER LEVER for js.idfkit.com (T117, FR-090). This is the whole configuration change
  # that stopped this site publishing. Nothing was deleted: docs/, mkdocs.yml and docs/CNAME are
  # untouched, and every step below still runs, so the site is still built and still proved to
  # build on every push. Only the deploy is withheld.
  #
  #   redirect-only  the cutover state: deploy-js-redirects.yml owns gh-pages and publishes the
  #                  redirect build to js.idfkit.com. This workflow builds but does not deploy.
  #   full-site      pre-cutover, or reverted: this workflow publishes the site again.
  #
  # deploy-js-redirects.yml carries a lever of the same name with values redirect-only and off.
  # Flip both together: exactly one of the two workflows may publish to gh-pages. The procedure
  # is in the idfkit repository at redirects/README.md.
  # ------------------------------------------------------------------------------------------
  JS_IDFKIT_COM_MODE: redirect-only

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # mkdocs-material's git-revision features and the TypeDoc source links
          # both want real history rather than a single commit.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: astral-sh/setup-uv@v5

      - run: npm ci

      # The API reference is generated by TypeDoc, which resolves @idfkit/schemas
      # through the "types" entry in its package.json — a path inside dist. On a
      # clean checkout dist does not exist, TypeDoc emits nothing, and the docs
      # build dies decoding empty JSON. Building first is what makes it work.
      - run: npx tsc --build

      - run: npm run docs:build

      - name: Say why nothing is being published
        if: env.JS_IDFKIT_COM_MODE != 'full-site'
        run: |
          echo "::notice::JS_IDFKIT_COM_MODE is '${JS_IDFKIT_COM_MODE}'. The site built, and was"
          echo "::notice::not published: js.idfkit.com serves redirects to developers.idfkit.com."

      - name: Deploy to GitHub Pages
        if: env.JS_IDFKIT_COM_MODE == 'full-site'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          # force_orphan keeps a single commit on gh-pages: the branch is build
          # output, so its history is worth nothing and grows without bound.
          force_orphan: true
          # Writes site/CNAME. docs/CNAME sets it too, so the custom domain
          # survives a local build or a deploy by any other route.
          cname: js.idfkit.com
