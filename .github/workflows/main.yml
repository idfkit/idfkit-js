name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check the schema bundle is in sync with its build script
        # The bundle is generated from idfkit's epJSON schemas and committed. If
        # someone edits build.mjs without regenerating, every other check still
        # passes against a stale bundle. The source schemas live in the Python
        # repo, so fetch it shallowly and rebuild.
        run: |
          git clone --depth 1 https://github.com/idfkit/idfkit.git /tmp/idfkit-py
          npm run build:schemas -- --source /tmp/idfkit-py/src/idfkit/schemas
          git diff --exit-code -- packages/schemas/data \
            || (echo "::error::Schema bundle is stale; run npm run build:schemas" && exit 1)

      - run: npm run format:check

      - name: Check the exported conformance level against the declared one
        # FR-024 makes the level a claim the release asserts, and CONFORMANCE_LEVEL is generated
        # from the pin in packages/core/package.json rather than restated beside it. A pin advanced
        # without regenerating would export a claim one tag stale, and nothing else here would
        # notice: the constant compiles, every test passes, and the wrong tag ships.
        run: npm run check:conformance-level

      - name: Typecheck sources and tests
        # tsconfig.test.json, not tsconfig.json: vitest transpiles without
        # typechecking, so the `@ts-expect-error` assertions in typed.test.ts
        # are only enforced here.
        run: npx tsc -p tsconfig.test.json

      - run: npx tsc --build

      - name: Type-check the documentation examples
        # Constitution VI, SC-019. Every TypeScript example the documentation publishes is a real
        # module in docs-snippets/, compiled here against the BUILT packages, resolved through
        # node_modules exactly as a reader resolves them. A renamed export, a changed signature or
        # a field that no longer exists fails this step and names the file, which carries the page
        # in its path. Before this, every fence on 18 pages was hand-typed text nothing compiled.
        #
        # After tsc --build, not before: resolution goes through each package's "types" entry,
        # which points inside dist.
        run: npm run typecheck:docs

  type-packages:
    name: Type packages carry no runtime
    runs-on: ubuntu-latest

    # BLOCKING, and it is meant to be. @idfkit/types-v26-1 and @idfkit/types-v9-4 exist so a
    # reader can decline 5.3 MB of generated declarations; that only holds while declining them
    # declines all of them. A type package with runtime in it is a package something can import a
    # value from, and the opt-in is gone the moment one consumer does (FR-039, FR-041, and
    # data-model section 7, where runtime_bytes "Must be zero").
    #
    # The regression this exists for already happened once: every generated module used to end
    # with `export const VERSION = '26.1.0'`, which nothing imported and which compiled to a
    # 256-byte .js file that went unnoticed for months. One line in the generator brings it back.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # After the build, never before it. The gate measures emitted JavaScript, so a .ts module
      # that slipped into a type package has to be compiled before there is anything to find.
      - run: npx tsc --build

      - run: npm run check:type-packages

  facade:
    name: The shared install name is the contracted surface
    runs-on: ubuntu-latest

    # BLOCKING. `idfkit` is the name a reader installs without ever learning the scoped names,
    # and it contains no implementation, so its entire content is its published surface. Four
    # one-word edits break it silently and none of them fail a test:
    #
    #   a fifth export entry            ships a subpath that resolves to nothing, which is how a
    #                                   name reserved in the naming register leaks into the
    #                                   published surface (FR-077);
    #   @idfkit/weather promoted to     puts a 1.6 MB station index on disk for every reader who
    #   dependencies                    never asked for weather (FR-043, SC-016);
    #   @idfkit/engine added anywhere   drags in 51 MB of WebAssembly and pins every facade user
    #                                   to one EnergyPlus release (FR-070);
    #   a name added to weather         exists under @idfkit/weather and not under
    #                                   idfkit/weather, with the types insisting otherwise,
    #                                   because weather.js cannot use `export *` (FR-074).
    #
    # The shape of what gets installed under a name is what that name means, and changing it
    # after publication breaks everyone who installed it.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # After the build: the drift half of the gate imports @idfkit/weather to read its real
      # exports, and that is dist output.
      - run: npx tsc --build

      - run: npm run check:facade

  distribution:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest

    # BLOCKING, all six. These are the criteria that say what `npm install idfkit` puts on a
    # stranger's disk and in their browser bundle, and they are the only ones in this feature that
    # cannot be corrected after the fact: the shape of what gets installed under a name IS what
    # that name means, and changing it later breaks everyone who installed it.
    #
    # None of them can be measured against this workspace, because a workspace install is a tree
    # of symlinks into packages/ and therefore contains every byte of everything, including the
    # 5.3 MB of generated declarations the type split exists to keep out. So each gate runs
    # `npm pack`, installs the resulting tarballs into a project under the runner's temp directory
    # (never inside this checkout: Node resolves node_modules UPWARD, and a fixture in the
    # workspace silently resolves packages it never installed), and measures that. Each takes one
    # to three seconds.
    #
    #   install size      under 1.875 MB on disk, measured as apparent bytes. The gate's own header
    #                     says why apparent and not allocated, prints both, and records why the
    #                     budget was raised from 1.5 MB on 2026-09-03 and again to 1.875 MB on
    #                     2026-09-06. 1.76 of 1.875 MB, 94 percent, with 114 KB of slack. The
    #                     header also names the lever nobody has pulled: 396 KB of the install is
    #                     source maps, which serve debugging and nothing at runtime.
    #   no index          zero stations.json bytes, the weather peer not auto-installed, no
    #                     engine. The peer's tarball is deliberately available to npm during the
    #                     install, so the absence is evidence about peerDependenciesMeta rather
    #                     than about what the registry could serve.
    #   ignore-scripts    no package declares an install lifecycle hook, and the tree installed
    #                     with --ignore-scripts is identical file for file to the one without.
    #   opt-out typing    zero generated declaration bytes anywhere on disk, a strict TypeScript
    #                     project working without a map, and a control proving one still attaches.
    #   bundle purity     an esbuild metafile for a minimal read-and-write page, with zero inputs
    #                     matching schema data, stations.json or types-v.
    #   absent component  importing idfkit/weather without the peer names `npm install
    #                     @idfkit/weather` rather than raising a bare ERR_MODULE_NOT_FOUND, a
    #                     project that never imports it type-checks clean, and the subpath works
    #                     once the peer is added.
    #
    # Do not add continue-on-error to any of them. Each one guards a number that only ever moves
    # in one direction unless something stops it.
    strategy:
      fail-fast: false
      matrix:
        include:
          - script: check:install-size
            name: Install size under the shared name (SC-012)
          - script: check:no-index
            name: No station index, no auto-installed peer (FR-043, SC-016)
          - script: check:ignore-scripts
            name: Install succeeds with --ignore-scripts (SC-015)
          - script: check:opt-out-typing
            name: Type packages are opt-out and free (SC-014)
          - script: check:bundle-purity
            name: A browser bundle carries no unrequested bytes (SC-013)
          - script: check:absent-component
            name: An absent opt-in component names its install (FR-074, SC-031)

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Before packing, not after. Every package ships dist and none declares a prepack script,
      # so `npm pack` copies whatever is on disk: pack before the build and the tarball has no
      # runtime in it, which every measurement downstream would then take at face value.
      - run: npx tsc --build

      - run: npm run ${{ matrix.script }}

  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
        os: [ubuntu-latest]
        include:
          # The parser reads files as latin-1 and the writer emits it. Windows
          # line endings and macOS defaults have both broken that before.
          - node: 22
            os: windows-latest
          - node: 22
            os: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - run: npm test

  budget:
    name: The performance budget
    runs-on: ubuntu-latest

    # ITS OWN JOB, and deliberately not a step inside `test`. The language service exists so that
    # an answer about the cursor costs the statement rather than the file, and a requirement with
    # no measurement behind it is a hope: bench/budget.mjs is the measurement, and it fails.
    #
    # Why it is not in the test suite. A timing threshold wired into the same run as the
    # correctness tests means a noisy neighbour on the runner blocks a documentation typo, and a
    # gate that fails work it has nothing to do with is a gate somebody switches off within the
    # month. Here a breach reports against itself and names the ratio that moved.
    #
    # Why it can fail on a shared runner at all. Every enforced number is a RATIO between two
    # figures measured in the same process on the same machine in the same run: a cursor answer
    # against parseIdf over the same text, scanIdf against parseIdf, parseIdf against lex, the
    # same cursor answer on the reference model against a file one hundredth its size, and the
    # same answer at the two ends of one comment-free file. A slower runner moves both halves
    # together and the ratio does not move. Absolute milliseconds are printed for a human to read
    # and nothing is held against them.
    #
    # The last two are the ones that pin the design, and they pin different axes. A ratio against
    # parseIdf could be met by a merely fast reparse; independence from file SIZE could not, and a
    # reparse shows a hundredfold difference on any machine. But size independence compares two
    # files and cannot see a cost that grows with the OFFSET, because both of its readings sit at
    # the same place in their own file. That is a real defect rather than a hypothetical one: a
    # backward search for an exclamation mark reads the whole prefix in a file that holds none,
    # and it measured 925x here while every other gate on this list stayed green.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # After the build: the benchmark reads dist, which is what an npm consumer receives, rather
      # than the sources a bundler would transform.
      - run: npx tsc --build

      - run: npm run check:bench

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: astral-sh/setup-uv@v5

      - run: npm ci

      # TypeDoc resolves @idfkit/schemas through the "types" entry in its
      # package.json, which points inside dist. Without this the reference pages
      # collect nothing and the build dies decoding empty JSON.
      - run: npx tsc --build

      - name: Build the documentation
        # --strict, so a broken internal link or a nav entry pointing at a
        # missing page fails here rather than shipping. This also exercises the
        # generated API reference: mkdocstrings runs TypeDoc over both packages,
        # so a source file that no longer compiles takes the docs down too.
        run: npm run docs:build

  conformance:
    # Read every EnergyPlus example file, for every version @idfkit/schemas bundles.
    #
    # This used to install EnergyPlus 26.1, roughly a gigabyte, to get at one release's example
    # files, and read them with one schema. It needed neither: the library parses against its own
    # bundled schemas, so the only thing wanted from a release is the files, and a blobless,
    # shallow, sparse clone of `testfiles/*.idf` is about 210 MB. Cached on the release tag, which
    # is immutable, so a hit is permanent and seventeen downloads happen once rather than per pull
    # request.
    #
    # Sweeping every version is what catches the two defects a single release cannot show. A parser
    # change safe on the newest schema and wrong on an older one, because field lists and
    # extensible groups moved between releases. And a file whose content belongs to one version
    # while its Version object declares another, which EnergyPlus ships several of.
    #
    # The counts are held per version and are compared against the Python library's, which sweeps
    # the same files. A number that moves on one side and not the other is a divergence.
    name: "E+ ${{ matrix.version }}"
    runs-on: ubuntu-latest
    strategy:
      # Every version reports for itself. One release failing must not cancel the sixteen that
      # would have told you whether the fault is that release or the change under test.
      fail-fast: false
      matrix:
        # `findings` is that version's MEASURED count, not a round number, so a regression of one
        # is caught. `errors` is zero: unlike the Python library, this one detects a Version object
        # wherever it sits, so no example file fails to read at all.
        #
        # These numbers are IDENTICAL to the Python library's, version for version, and that is
        # the point: the two sweep the same files and any number that moves on one side alone is a
        # divergence. Three everywhere is the two parametric-preprocessor files; 22.2.0 adds nine
        # objects absent from the schema its files declare, 25.2.0 and 24.1.0 one stale-stamp file
        # each.
        include:
          - { version: "8.9.0", findings: 3, errors: 0 }
          - { version: "9.0.1", findings: 3, errors: 0 }
          - { version: "9.1.0", findings: 3, errors: 0 }
          - { version: "9.2.0", findings: 3, errors: 0 }
          - { version: "9.3.0", findings: 3, errors: 0 }
          - { version: "9.4.0", findings: 3, errors: 0 }
          - { version: "9.5.0", findings: 3, errors: 0 }
          - { version: "9.6.0", findings: 3, errors: 0 }
          - { version: "22.1.0", findings: 3, errors: 0 }
          - { version: "22.2.0", findings: 13, errors: 0 }
          - { version: "23.1.0", findings: 3, errors: 0 }
          - { version: "23.2.0", findings: 3, errors: 0 }
          - { version: "24.1.0", findings: 4, errors: 0 }
          - { version: "24.2.0", findings: 3, errors: 0 }
          - { version: "25.1.0", findings: 3, errors: 0 }
          - { version: "25.2.0", findings: 8, errors: 0 }
          - { version: "26.1.0", findings: 3, errors: 0 }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The sweep reads `dist/`, which is what an npm consumer receives, rather than the sources a
      # bundler would transform. `typecheck` is `tsc --build`, so this is the build.
      - run: npm run typecheck

      - name: Cache the example files
        id: cache-examples
        uses: actions/cache@v4
        with:
          path: ep/testfiles
          # The hash of the sparse file is in the key, so changing what is swept changes the key.
          # Keying on the tag alone served a stale selection when the exclusion below was added.
          key: ep-testfiles-v${{ matrix.version }}-${{ hashFiles('.github/ep-testfiles.sparse') }}

      - name: Fetch the example files for this release
        if: steps.cache-examples.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          # NREL/EnergyPlus redirects here since the rename. The canonical name is used so that the
          # redirect being dropped some day is a loud failure rather than a silent one.
          REPO=https://github.com/NatLabRockies/EnergyPlus

          # --filter=blob:none fetches no file contents until checkout and --depth 1 no history;
          # the sparse pattern then pulls only the IDF files.
          git clone --filter=blob:none --no-checkout --depth 1 \
            --branch "v${{ matrix.version }}" "$REPO" ep
          cd ep
          # The selection lives in .github/ep-testfiles.sparse, which the cache key hashes, so the
          # two cannot disagree about what should be present.
          mapfile -t PATTERNS < <(grep -vE '^[[:space:]]*(#|$)' "$GITHUB_WORKSPACE/.github/ep-testfiles.sparse")
          git sparse-checkout set --no-cone "${PATTERNS[@]}"
          git checkout

      - name: Fail if the example files were not found
        run: |
          # An empty sweep passes every threshold while proving nothing.
          count=$(find ep/testfiles -maxdepth 1 -name '*.idf' | wc -l)
          echo "found $count example files for ${{ matrix.version }}"
          test "$count" -gt 0 \
            || (echo "::error::no example files at v${{ matrix.version }}; the sweep proved nothing" && exit 1)

      - name: Read every file
        run: |
          node scripts/sweep-example-files.mjs ep/testfiles \
            --max-findings ${{ matrix.findings }} --max-errors ${{ matrix.errors }}
