name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: >
          Version to publish, e.g. 0.1.0. Leave empty to pack without
          publishing. Use this to finish a release whose publish partially
          failed, without deleting and recreating the release.
        type: string
        required: false

permissions:
  contents: read
  # Required for npm trusted publishing: GitHub mints a short-lived OIDC token
  # that npm exchanges for publish rights, so there is no long-lived NPM_TOKEN
  # to store or rotate. Same arrangement as idfkit-engine.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Trusted publishing needs Node >= 22.14.0; '22' resolves to the
          # latest 22.x, which satisfies it.
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >= 11.5.1, newer than the npm bundled with
      # Node 22. Without this the publish falls back to looking for a token and
      # fails with an authentication error rather than anything self-explanatory.
      - name: Use an npm that supports trusted publishing
        run: |
          npm install -g npm@latest
          npm --version

      - run: npm ci

      - name: Verify before publishing
        run: |
          npx tsc -p tsconfig.test.json
          npm test

      - run: npx tsc --build

      - name: Resolve the version to publish
        # A release publishes its own tag. A manual run publishes only when
        # given an explicit version, and otherwise just packs.
        run: |
          if [ "${{ github.event_name }}" = 'release' ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${{ inputs.version }}"
          fi
          if [ -n "$VERSION" ]; then
            echo "VERSION=$VERSION" >> "$GITHUB_ENV"
            echo "PUBLISH=true" >> "$GITHUB_ENV"
            echo "Publishing $VERSION"
          else
            echo "PUBLISH=false" >> "$GITHUB_ENV"
            echo "No version given; packing only."
          fi

      - name: Set versions
        if: env.PUBLISH == 'true'
        # The git tag is the source of truth, matching how the Python package
        # releases. package.json versions are placeholders in the repo.
        run: |
          # --workspaces-update=false is load-bearing. Without it, npm rewrites
          # package-lock.json after the bump: core's lock entry still asks for
          # @idfkit/schemas at the old placeholder version, the local workspace
          # no longer satisfies it, so npm reaches for the registry and fails
          # with ETARGET on a version that was never published. The lockfile is
          # not part of any published tarball, so leaving it stale is harmless.
          npm version "$VERSION" --workspaces --no-git-tag-version --allow-same-version --workspaces-update=false
          npm pkg set "dependencies.@idfkit/schemas=$VERSION" -w @idfkit/core

      - name: Publish
        if: env.PUBLISH == 'true'
        # No --provenance flag and no NODE_AUTH_TOKEN: with OIDC on a public
        # repository publishing a public package, npm generates and publishes
        # the provenance attestation by default.
        run: |
          # Skip anything already on the registry. npm refuses to republish a
          # version, and without this the whole step aborts on the first
          # already-published package, so a release that failed partway can
          # never be completed by re-running it.
          # schemas first: core depends on it by exact version. weather has no
          # workspace dependencies, so its position does not matter.
          for pkg in @idfkit/schemas @idfkit/core @idfkit/weather; do
            if npm view "$pkg@$VERSION" version >/dev/null 2>&1; then
              echo "$pkg@$VERSION is already published; skipping."
            else
              npm publish -w "$pkg" --access public
            fi
          done

      - name: Pack only
        if: env.PUBLISH != 'true'
        run: npm pack --workspaces --pack-destination /tmp
